openapi: 3.0.3
info:
  title: Transaction Ledger API
  version: 1.0.0
  description: |
    Accounts, credits and debits, balances, paginated history and atomic transfers.

    - Amounts are in **rupees** (INR) with up to 2 decimal places; they are stored as integer paise.
    - Timestamps are ISO-8601 in UTC.
    - Every error has the same shape: `{ "error": { "code", "message", "details"? } }`.
# No authentication: out of scope for this assignment (see README assumptions).
security: []
servers:
  - url: /
    description: The server this document is served from
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Accounts
  - name: Transactions
  - name: Transfers
  - name: System

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Health check (includes the database connection)
      responses:
        '200':
          description: API and database are reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      description: Balance always starts at 0. `id`, `balance` and `created_at` are set by the server; sending them is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
            example: { name: Aman Singh }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts (newest first)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get one account
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /accounts/{id}/balance:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getBalance
      summary: Get an account's balance
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /accounts/{id}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Add a credit or debit
      description: |
        A credit adds to the balance; a debit subtracts and is rejected (422) if the balance is too low.
        `reference_id` is unique per account: repeating it returns 409 with the original transaction and changes nothing.
        The transaction insert and the balance update are one database transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionRequest' }
            examples:
              credit:
                value: { type: credit, amount: 100, reference_id: INV-1001, description: Opening deposit }
              debit:
                value: { type: debit, amount: 30, reference_id: PAY-2001, description: Groceries }
      responses:
        '201':
          description: Transaction recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409':
          description: A transaction with this reference_id already exists for this account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: DUPLICATE_TRANSACTION
                  message: A transaction with reference_id "INV-1001" already exists for this account
                  details:
                    transaction:
                      id: a47ce5a4-0a3f-4d7e-8962-61677eb5bae5
                      account_id: 7161a094-fa59-4b03-8aa8-e9ab5ad2edb5
                      type: credit
                      amount: 100
                      description: Opening deposit
                      reference_id: INV-1001
                      transfer_id: null
                      created_at: '2026-10-26T11:22:19.007Z'
        '422': { $ref: '#/components/responses/InsufficientBalance' }
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Transaction history (newest first)
      parameters:
        - name: type
          in: query
          description: Only credits or only debits. Leave it out for both.
          schema: { type: string, enum: [credit, debit] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of transactions
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Transfer money between two accounts (atomic)
      description: |
        Debits the source and credits the destination in one database transaction: if any step fails, nothing is saved.
        Creates a transfer record and two linked transactions (`transfer_id`), each with reference `transfer:{reference_id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferRequest' }
            example:
              from_account_id: 7161a094-fa59-4b03-8aa8-e9ab5ad2edb5
              to_account_id: bfd55be2-dd2c-4a79-a9c3-14865f1a0cc9
              amount: 30
              reference_id: TRF-001
              description: Rent share
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409':
          description: A transfer with this reference_id already exists for this source account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/InsufficientBalance' }

components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      description: Account UUID. A malformed id returns 400 INVALID_ACCOUNT_ID.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }

  schemas:
    Money:
      type: number
      description: Rupees, greater than 0, at most 2 decimal places, at most 1,000,000,000.
      minimum: 0.01
      maximum: 1000000000
      multipleOf: 0.01
      example: 100
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, example: Aman Singh }
    Account:
      type: object
      required: [id, name, balance, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Aman Singh }
        balance: { type: number, example: 0 }
        created_at: { type: string, format: date-time }
    Balance:
      type: object
      required: [account_id, balance, currency]
      properties:
        account_id: { type: string, format: uuid }
        balance: { type: number, example: 100 }
        currency: { type: string, example: INR }
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required: [type, amount, reference_id]
      properties:
        type: { type: string, enum: [credit, debit] }
        amount: { $ref: '#/components/schemas/Money' }
        reference_id:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique per account. Reusing it is treated as a duplicate.
          example: INV-1001
        description: { type: string, maxLength: 500, nullable: true, example: Opening deposit }
    Transaction:
      type: object
      required: [id, account_id, type, amount, description, reference_id, transfer_id, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        type: { type: string, enum: [credit, debit] }
        amount: { type: number, example: 100 }
        description: { type: string, nullable: true }
        reference_id: { type: string, example: INV-1001 }
        transfer_id: { type: string, format: uuid, nullable: true, description: Set on the two legs of a transfer }
        created_at: { type: string, format: date-time }
    TransactionCreated:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required: [account_balance]
          properties:
            account_balance: { type: number, description: Balance after this transaction, example: 100 }
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [from_account_id, to_account_id, amount]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid, description: Must differ from from_account_id }
        amount: { $ref: '#/components/schemas/Money' }
        reference_id:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional. Unique per source account; generated by the server when omitted.
        description: { type: string, maxLength: 500, nullable: true }
    Transfer:
      type: object
      required: [id, from_account_id, to_account_id, amount, reference_id, created_at]
      properties:
        id: { type: string, format: uuid }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount: { type: number, example: 30 }
        description: { type: string, nullable: true }
        reference_id: { type: string }
        created_at: { type: string, format: date-time }
    AccountBalance:
      type: object
      required: [id, balance]
      properties:
        id: { type: string, format: uuid }
        balance: { type: number }
    TransferCreated:
      type: object
      required: [transfer, debit_transaction, credit_transaction, from_account, to_account]
      properties:
        transfer: { $ref: '#/components/schemas/Transfer' }
        debit_transaction: { $ref: '#/components/schemas/Transaction' }
        credit_transaction: { $ref: '#/components/schemas/Transaction' }
        from_account: { $ref: '#/components/schemas/AccountBalance' }
        to_account: { $ref: '#/components/schemas/AccountBalance' }
    Pagination:
      type: object
      required: [current_page, page_size, total_records, total_pages]
      properties:
        current_page: { type: integer, example: 1 }
        page_size: { type: integer, example: 10 }
        total_records: { type: integer, example: 8 }
        total_pages: { type: integer, example: 1 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - INVALID_ACCOUNT_ID
                - INVALID_TRANSACTION_TYPE
                - INVALID_AMOUNT
                - INVALID_PAGINATION
                - SAME_ACCOUNT_TRANSFER
                - ACCOUNT_NOT_FOUND
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - DUPLICATE_TRANSACTION
                - DUPLICATE_TRANSFER
                - PAYLOAD_TOO_LARGE
                - INSUFFICIENT_BALANCE
                - INTERNAL_ERROR
            message: { type: string }
            details:
              description: Field errors, the existing duplicate, or balance figures, depending on the code.

  responses:
    BadRequest:
      description: Invalid input (body, id, type, amount or pagination)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalidAmount:
              value:
                error:
                  code: INVALID_AMOUNT
                  message: amount must be greater than 0
                  details: [{ field: amount, message: amount must be greater than 0 }]
            invalidPagination:
              value:
                error:
                  code: INVALID_PAGINATION
                  message: page must be at least 1
                  details: [{ field: page, message: page must be at least 1 }]
    AccountNotFound:
      description: No account with that id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: ACCOUNT_NOT_FOUND
              message: Account 00000000-0000-4000-8000-000000000000 was not found
              details: { account_id: 00000000-0000-4000-8000-000000000000 }
    InsufficientBalance:
      description: Debit or transfer larger than the current balance; nothing changes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: INSUFFICIENT_BALANCE
              message: 'Insufficient balance: account has 100, debit needs 150'
              details: { account_id: 7161a094-fa59-4b03-8aa8-e9ab5ad2edb5, balance: 100, requested: 150 }
