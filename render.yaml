# Render Blueprint for the backend API. You can also create the Web Service by
# hand with the same settings (see DEPLOY.md).
services:
  - type: web
    name: transaction-ledger-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # paste the Supabase Session pooler connection string in the dashboard
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
